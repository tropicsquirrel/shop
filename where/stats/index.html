<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>where · views</title>
<style>
  :root { --grn:#33ff36; --dim:#1a9e1d; --bg:#000; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; }
  body {
    background:var(--bg); color:var(--grn);
    font-family:ui-monospace,Menlo,Consolas,monospace;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; padding:1.5rem; text-align:center;
    -webkit-font-smoothing:antialiased;
  }
  .label { color:var(--dim); font-size:.8rem; letter-spacing:.15em; text-transform:uppercase; }
  #count { font-size:4.5rem; line-height:1; margin:.4rem 0 .2rem; font-variant-numeric:tabular-nums; }
  #count.err { font-size:1.2rem; color:var(--dim); }
  #win { font-size:1rem; margin-bottom:1.6rem; }
  .btns { display:flex; gap:.5rem; }
  .btns button {
    background:transparent; color:var(--grn); border:1px solid var(--dim);
    border-radius:4px; padding:.5rem .9rem; font:inherit; font-size:.85rem; cursor:pointer;
  }
  .btns button.active { background:#062; border-color:var(--grn); }
  #foot { color:var(--dim); font-size:.75rem; margin-top:1.6rem; min-height:1em; }
</style>
</head>
<body>
  <div class="label">Page opens</div>
  <div id="count">…</div>
  <div id="win" class="label">last 30 min</div>
  <div class="btns">
    <button data-m="30" class="active">30m</button>
    <button data-m="60">60m</button>
    <button data-m="180">3h</button>
    <button data-m="1440">24h</button>
  </div>
  <div id="foot"></div>

<script>
(function () {
  var EXEC = 'https://script.google.com/macros/s/AKfycbyRy9S7-xi93kd_sh0fyzFVZnBoudy8tpMDkJsdacOcCSldfXntpgwPU7AN5ySJafUN/exec';
  var qs = new URLSearchParams(location.search);
  var key = qs.get('key') || '';
  var mins = parseInt(qs.get('mins')) || 30;
  var countEl = document.getElementById('count');
  var winEl = document.getElementById('win');
  var footEl = document.getElementById('foot');
  var btns = Array.prototype.slice.call(document.querySelectorAll('.btns button'));

  function human(m) {
    if (m % 1440 === 0) return (m / 1440) + (m === 1440 ? '' : '') + (m / 1440 === 1 ? ' day' : ' days');
    if (m % 60 === 0) return (m / 60) + ' h';
    return m + ' min';
  }
  function setActive() {
    btns.forEach(function (b) { b.classList.toggle('active', parseInt(b.dataset.m) === mins); });
    winEl.textContent = 'last ' + human(mins);
  }
  function load() {
    if (!key) { countEl.textContent = 'add ?key=… to the URL'; countEl.classList.add('err'); return; }
    footEl.textContent = 'updating…';
    fetch(EXEC + '?action=where_stats&key=' + encodeURIComponent(key) + '&mins=' + mins + '&t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && typeof d.count === 'number') {
          countEl.textContent = d.count;
          countEl.classList.remove('err');
          footEl.textContent = 'auto-refreshes every 30s';
        } else {
          countEl.textContent = (d && d.error) ? d.error : 'no data';
          countEl.classList.add('err');
          footEl.textContent = '';
        }
      })
      .catch(function () { footEl.textContent = 'Could not refresh — check connection.'; });
  }
  btns.forEach(function (b) {
    b.addEventListener('click', function () { mins = parseInt(b.dataset.m); setActive(); load(); });
  });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });
  setInterval(function () { if (!document.hidden) load(); }, 30000);
  setActive();
  load();
})();
</script>
</body>
</html>
